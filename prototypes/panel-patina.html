<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Patina Prototype</title>
<style>
  :root { --page: #161618; --ink: #e8e4da; --muted: #8f8b82; --accent: #e0a040; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; transition: background .3s; }
  body[data-style="flat"] { --page: #dcd9d2; --ink: #26252a; --muted: #6b6860; }

  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 16px 24px; max-width: 1000px; margin: 0 auto; }
  .bar h1 { font-size: 14px; margin: 0 12px 0 0; }
  .bar .hint { color: var(--muted); margin-left: auto; }
  .seg { display: inline-flex; border: 1px solid #0003; border-radius: 8px; overflow: hidden; }
  .seg button, .b { background: #ffffff14; color: var(--ink); border: 0; padding: 7px 12px; font: inherit; cursor: pointer; }
  .b { border: 1px solid #0003; border-radius: 8px; }
  .seg button.on { background: var(--accent); color: #1b1c1e; }
  .stage { display: flex; justify-content: center; padding: 24px 16px 60px; }

  /* ---------- shared component scaffolding ---------- */
  .surface { position: relative; user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer; }
  .surface > canvas.patina { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; border-radius: inherit; z-index: 0; }
  .surface > :not(canvas) { position: relative; z-index: 1; }

  .wrap { border-radius: 22px; transition: all .3s; }
  .device { display: flex; gap: 40px; padding: 28px 40px 36px; border-radius: 16px; flex-wrap: wrap; justify-content: center; position: relative; transition: all .3s; }
  .device header { flex-basis: 100%; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: -8px; }
  .brand { font-weight: 800; letter-spacing: .18em; font-size: 15px; }
  .model { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
  .col { display: flex; flex-direction: column; gap: 26px; align-items: center; }
  .cap { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; opacity: .75; margin-top: 8px; text-align: center; }

  .pads { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
  .pad { width: 72px; height: 72px; }
  #button { width: 140px; height: 60px; }
  .row { display: flex; gap: 28px; align-items: flex-start; }
  #rocker { width: 50px; height: 80px; }
  #slide { width: 88px; height: 40px; }
  #slide-thumb { position: absolute !important; top: 3px; left: 3px; width: 40px; height: 34px; transition: transform .12s; }
  #slide.on #slide-thumb { transform: translateX(42px); }
  #slider { width: 264px; height: 46px; }
  #slider-thumb { position: absolute !important; top: 4px; width: 26px; height: 38px; transition: left .06s; }
  .dial { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
  .dial svg { position: absolute; inset: 0; }
  #knob { width: 92px; height: 92px; border-radius: 50%; cursor: ns-resize; }
  .display { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; position: relative; }
  #label { width: 92px; height: 22px; }
  #field { width: 220px; height: 40px; cursor: text; }
  #field input { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; border: 0; outline: none; padding: 0 12px; font: inherit; color: inherit; z-index: 1; }
  .tip { position: absolute; left: 0; top: -44px; padding: 8px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; z-index: 10; pointer-events: none; opacity: 0; transform: translateY(4px); transition: all .15s; }
  .tip.show { opacity: 1; transform: none; }

  /* ---------- cloth ---------- */
  .clothbar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 0 24px 8px; max-width: 1000px; margin: 0 auto; color: var(--muted); }
  .clothbar label { display: inline-flex; gap: 8px; align-items: center; }
  .clothbar input[type=range] { width: 110px; accent-color: var(--accent); }
  .clothbar output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 34px; }
  .clothbar select { background: #ffffff14; color: var(--ink); border: 1px solid #0003; border-radius: 6px; font: inherit; padding: 4px; }
  #clothBtn.on { background: var(--accent); color: #1b1c1e; }
  body.cloth .device, body.cloth .device * { cursor: none !important; }
  #cloth { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 100; display: none; }
  body.cloth #cloth { display: block; }
  #cloth .rag { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) rotate(-12deg); border-radius: 48% 52% 42% 58% / 56% 44% 56% 44%;
    background: repeating-linear-gradient(35deg, #ffffff10 0 2px, transparent 2px 5px), radial-gradient(120% 90% at 35% 30%, #c4d2de, #8ea3b6 60%, #71879b);
    box-shadow: inset -4px -6px 10px #0003, inset 3px 3px 6px #fff6, 0 6px 14px #0007; transition: transform .08s; }
  #cloth .rag::before { content: ""; position: absolute; inset: 18% 10% 40% 22%; border-radius: 50%; border-top: 2px solid #ffffff40; transform: rotate(-20deg); }
  #cloth .rag::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(70% 60% at 50% 60%, #5e4c34, #3e3020); opacity: var(--soil, 0); mix-blend-mode: multiply; }
  #cloth.down .rag { transform: translate(-50%, -50%) rotate(-12deg) scale(.92); }
  #cloth .ring { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; border: 1.5px solid #ffffffb0; box-shadow: 0 0 0 1px #0006; }
  #cloth[data-cursor="rag"] .ring, #cloth[data-cursor="ring"] .rag { display: none; }
  #panel > canvas.patina { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; border-radius: inherit; z-index: 0; }
  #panel > :not(canvas) { position: relative; z-index: 1; }
  body.panelprint #panel .brand, body.panelprint #panel .model, body.panelprint #panel .cap { color: transparent; }

  /* ---------- SKEUOMORPHIC ---------- */
  [data-style="skeuo"] .wrap { padding: 0 22px; background: linear-gradient(90deg, #4a2a16, #7a4a28 12%, #5c351c 40%, #80502c 70%, #4a2a16); box-shadow: 0 20px 50px #000a, inset 0 1px 0 #ffffff22; }
  [data-style="skeuo"] .device { background: repeating-linear-gradient(90deg, #ffffff05 0 1px, transparent 1px 3px), linear-gradient(180deg, #34343a, #26262a); color: #e9e2cf; box-shadow: inset 0 1px 0 #ffffff1c, inset 0 -2px 0 #0008, 0 0 0 1px #0009; }
  [data-style="skeuo"] .device::before, [data-style="skeuo"] .device::after { content: ""; position: absolute; top: 12px; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #bbb, #555); box-shadow: 0 1px 1px #000a; }
  [data-style="skeuo"] .device::before { left: 12px; } [data-style="skeuo"] .device::after { right: 12px; }
  [data-style="skeuo"] .brand { font-family: "Futura", "Avenir Next", sans-serif; }
  [data-style="skeuo"] .pad { border-radius: 8px; background: radial-gradient(120% 120% at 50% 25%, #6a6964, #4d4c48); box-shadow: inset 0 1px 0 #ffffff24, inset 0 -3px 2px #0005, 0 3px 0 #141414, 0 5px 10px #0008; }
  [data-style="skeuo"] .pad:active { transform: translateY(2px); box-shadow: inset 0 1px 0 #ffffff1a, inset 0 -1px 1px #0005, 0 1px 0 #141414, 0 2px 4px #0008; }
  [data-style="skeuo"] #button { border-radius: 10px; background: linear-gradient(180deg, #e2733a, #c45823); box-shadow: inset 0 1px 0 #ffffff40, inset 0 -3px 2px #0004, 0 3px 0 #6a2a0c, 0 6px 12px #0009; }
  [data-style="skeuo"] #button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 #ffffff30, 0 1px 0 #6a2a0c, 0 2px 4px #0009; }
  [data-style="skeuo"] #rocker { border-radius: 6px; background: linear-gradient(180deg, #3b3b3d, #1c1c1e 48%, #111 52%, #262628); box-shadow: inset 0 1px 0 #ffffff22, 0 0 0 3px #0c0c0c, 0 4px 8px #000a; }
  [data-style="skeuo"] #rocker.on { background: linear-gradient(180deg, #161618, #262628 48%, #3a3a3c 52%, #222224); }
  [data-style="skeuo"] #slide { border-radius: 6px; background: linear-gradient(180deg, #0c0c0d, #1d1d20); box-shadow: inset 0 2px 4px #000c, 0 1px 0 #ffffff1a; }
  [data-style="skeuo"] #slide-thumb { border-radius: 4px; background: linear-gradient(180deg, #ebe4d2, #c9c0aa); box-shadow: inset 0 1px 0 #fff8, inset 0 -2px 0 #0003, 0 2px 4px #000a; }
  [data-style="skeuo"] #slider { border-radius: 6px; background: linear-gradient(180deg, #2b2b2f, #232327); }
  [data-style="skeuo"] #slider::before { content: ""; position: absolute; left: 14px; right: 14px; top: 20px; height: 6px; border-radius: 3px; background: #050505; box-shadow: inset 0 1px 2px #000, 0 1px 0 #ffffff1a; z-index: 1; }
  [data-style="skeuo"] #slider-thumb { border-radius: 4px; background: repeating-linear-gradient(180deg, #d9d9d9 0 2px, #9a9a9a 2px 4px); box-shadow: 0 3px 6px #000c, inset 0 0 0 1px #0005; z-index: 2; }
  [data-style="skeuo"] #knob { background: radial-gradient(circle at 50% 50%, #6c6c70 0 34%, #3a3a3d 35% 37%, transparent 38%), repeating-conic-gradient(#1a1a1c 0 4deg, #2e2e31 4deg 8deg); box-shadow: 0 6px 14px #000c, inset 0 1px 0 #ffffff2a, 0 0 0 2px #0a0a0a; }
  [data-style="skeuo"] .dial svg { color: #e9e2cf; }
  [data-style="skeuo"] #label { border-radius: 4px; background: #45454a; box-shadow: inset 0 1px 0 #ffffff18, 0 2px 0 #111; }
  [data-style="skeuo"] #field { border-radius: 6px; background: linear-gradient(180deg, #8d9a6a, #a8b583); color: #1f2614; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; letter-spacing: .06em; box-shadow: inset 0 3px 6px #0007, 0 0 0 4px #111, 0 1px 0 4px #ffffff14; }
  [data-style="skeuo"] .tip { background: #efe8d4; color: #222; box-shadow: 0 6px 16px #000a; }

  /* ---------- FLAT ---------- */
  [data-style="flat"] .wrap { padding: 0; }
  [data-style="flat"] .device { background: #f4f2ed; color: #26252a; border-radius: 24px; }
  [data-style="flat"] .brand { font-weight: 700; letter-spacing: .02em; text-transform: lowercase; }
  [data-style="flat"] .pad { border-radius: 14px; background: #e4e0d8; }
  [data-style="flat"] .pad:active { background: #d8d3c9; }
  [data-style="flat"] #button { border-radius: 30px; background: #ff5a36; }
  [data-style="flat"] #button:active { background: #ec4a27; }
  [data-style="flat"] #rocker { border-radius: 14px; background: linear-gradient(180deg, #e4e0d8 50%, #26252a 50%); }
  [data-style="flat"] #rocker.on { background: linear-gradient(180deg, #ff5a36 50%, #e4e0d8 50%); }
  [data-style="flat"] #slide { border-radius: 20px; background: #e4e0d8; transition: background .15s; }
  [data-style="flat"] #slide.on { background: #ff5a36; }
  [data-style="flat"] #slide-thumb { border-radius: 17px; background: #fff; }
  [data-style="flat"] #slider { border-radius: 10px; background: transparent; }
  [data-style="flat"] #slider::before { content: ""; position: absolute; left: 14px; right: 14px; top: 21px; height: 4px; border-radius: 2px; background: #d3cec4; z-index: 1; }
  [data-style="flat"] #slider-thumb { top: 9px; height: 28px; border-radius: 14px; background: #26252a; z-index: 2; }
  [data-style="flat"] #knob { background: #e4e0d8; }
  [data-style="flat"] .dial svg { color: #26252a; }
  [data-style="flat"] #label { border-radius: 11px; background: #e4e0d8; }
  [data-style="flat"] #field { border-radius: 10px; background: #fff; color: #26252a; font-size: 15px; box-shadow: inset 0 0 0 1.5px #d3cec4; }
  [data-style="flat"] #field:focus-within { box-shadow: inset 0 0 0 2px #ff5a36; }
  [data-style="flat"] .tip { background: #26252a; color: #fff; }
</style>
</head>
<body data-style="skeuo">
<div id="cloth" data-cursor="rag"><div class="rag"></div><div class="ring"></div></div>

  <div class="bar">
    <h1>Panel patina</h1>
    <div class="seg" id="styleSeg" style="display:none"><button data-s="skeuo" class="on">Skeuomorphic</button></div>
    <button class="b" id="clothBtn">Cloth</button>
    <button class="b" data-sim="50">Use +50</button>
    <button class="b" data-sim="500">Use +500</button>
    <button class="b" data-sim="3000">Use +3000</button>
    <button class="b" id="reset">Reset</button>
    <span class="hint">C toggles the cloth · drag to scrub · wear stays</span>
  </div>

  <div class="clothbar">
    <label>Lift <input type="range" id="lift" min="0.01" max="0.4" step="0.01"><output id="lift-o"></output></label>
    <label><select id="liftMode"><option value="prop">% of dirt there</option><option value="fixed">fixed amount</option></select></label>
    <label>Brush <input type="range" id="brush" min="8" max="44" step="1"><output id="brush-o"></output></label>
    <label>Smear <input type="range" id="smear" min="0" max="0.9" step="0.05"><output id="smear-o"></output></label>
    <label>Cursor <select id="cursor"><option value="rag">Rag</option><option value="ring">Ring</option><option value="both">Rag + ring</option></select></label>
    <span>Dirt left <output id="dirtLeft"></output></span>
    <button class="b" id="copy">Copy settings</button>
  </div>
  <div class="clothbar">
    <label>Panel <select id="pmode">
      <option value="none">Dial ring only</option>
      <option value="halo">Halo round every control</option>
      <option value="panel">Whole panel (halo + hand resting)</option>
    </select></label>
    <label>Spread <input type="range" id="spread" min="0" max="3" step="0.1"><output id="spread-o"></output></label>
    <label><input type="checkbox" id="pprint"> Panel print wears (captions, brand)</label>
  </div>

  <div class="stage">
    <div class="wrap">
      <div class="device" id="panel">
        <header><span class="brand">PATINA·7</span><span class="model">Sample station</span></header>

        <div class="col">
          <div class="pads" id="pads"></div>
          <div class="cap">Pads</div>
        </div>

        <div class="col">
          <div>
            <div class="dial"><svg viewBox="0 0 150 150" id="scale"></svg><div class="surface" id="knob"></div></div>
            <div class="cap">Tone</div>
          </div>
          <div>
            <div class="surface" id="slider"><div class="surface" id="slider-thumb"></div></div>
            <div class="cap">Filter</div>
          </div>
        </div>

        <div class="col" style="align-items:flex-start">
          <div class="display">
            <div class="tip" id="tip">Name this kit — it shows on the display.</div>
            <div class="surface" id="label"></div>
            <div class="surface" id="field"><input id="input" value="DUSTY KIT 01" spellcheck="false"></div>
          </div>
          <div><div class="surface" id="button"></div></div>
          <div class="row">
            <div><div class="surface" id="rocker"></div><div class="cap">Power</div></div>
            <div><div class="surface" id="slide"><div class="surface" id="slide-thumb"></div></div><div class="cap">Hold</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // Rates from "What dirt and wear rates feel right?"
  const R = { dirtRate: 0.025, dirtCeiling: 0.85, wearRate: 0.025 / 40, radius: 0.22 };
  const KEY = "worn-ui:panel-patina";
  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } },
    save(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
  };

  // ---------- styles: material per surface kind ----------
  // print: legend colour; dirt: grime colour; sheen: [r,g,b,amount] for lost finish
  const STYLES = {
    skeuo: {
      font: w => `${w} %spx "Futura", "Avenir Next Condensed", "Arial Narrow", sans-serif`,
      upper: true,
      mat: {
        pad:    { print: "#ede6d2", dirt: "#9a8a6c", sheen: [1, 1, 1, .22] },
        button: { print: "#2a1408", dirt: "#4a2e1a", sheen: [1, .9, .8, .25] },
        rocker: { print: "#ede6d2", dirt: "#9a8a6c", sheen: [1, 1, 1, .2] },
        track:  { print: "#ede6d2", dirt: "#8a7a5c", sheen: [1, 1, 1, .15] },
        thumb:  { print: "#3a3020", dirt: "#5e4c34", sheen: [1, 1, 1, .2] },
        knob:   { print: "#f2ecda", dirt: "#9a8a6c", sheen: [1, 1, 1, .25] },
        label:  { print: "#ede6d2", dirt: "#9a8a6c", sheen: [1, 1, 1, .2] },
        field:  { print: "#1f2614", dirt: "#3c3a26", sheen: [1, 1, .9, .25] },
        panel:  { print: "#e9e2cf", dirt: "#9a8a6c", sheen: [1, 1, 1, .1] },
      },
    },
    flat: {
      font: w => `${w === 800 ? 600 : 500} %spx ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif`,
      upper: false,
      mat: {
        pad:    { print: "#26252a", dirt: "#7a6a52", sheen: [0, 0, 0, .1] },
        button: { print: "#ffffff", dirt: "#5a3424", sheen: [1, 1, 1, .2] },
        rocker: { print: "#26252a", dirt: "#7a6a52", sheen: [0, 0, 0, .1] },
        track:  { print: "#26252a", dirt: "#7a6a52", sheen: [0, 0, 0, .1] },
        thumb:  { print: "#26252a", dirt: "#7a6a52", sheen: [0, 0, 0, .08] },
        knob:   { print: "#26252a", dirt: "#7a6a52", sheen: [0, 0, 0, .1] },
        label:  { print: "#26252a", dirt: "#7a6a52", sheen: [0, 0, 0, .1] },
        field:  { print: "#26252a", dirt: "#7a6a52", sheen: [0, 0, 0, .06] },
      },
    },
  };
  let style = "skeuo";
  const st = () => STYLES[style];
  const txt = t => st().upper ? t.toUpperCase() : t[0] + t.slice(1).toLowerCase();
  const font = (weight, px) => st().font(weight).replace("%s", px);

  // ---------- print masks (white on transparent; colour comes from the material) ----------
  const PAD_NAMES = ["Kick", "Snare", "Hat", "Clap", "Tom", "Rim", "Perc", "Crash", "Fx"];
  const centreText = (c, t, x, y) => { c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(t, x, y); };
  const PRINT = {
    pad(c, w, h, s) {
      c.font = font(800, h * 0.34); centreText(c, String(s.index + 1).padStart(2, "0"), w / 2, h * 0.44);
      c.font = font(600, h * 0.13); c.letterSpacing = `${h * 0.02}px`; centreText(c, txt(PAD_NAMES[s.index]), w / 2, h * 0.74);
    },
    button(c, w, h) {
      c.font = font(800, h * 0.36); c.letterSpacing = `${h * 0.05}px`; centreText(c, txt("Play"), w / 2 + h * 0.15, h / 2 + 1);
      c.beginPath(); c.moveTo(w * 0.13, h * 0.36); c.lineTo(w * 0.13 + h * 0.24, h * 0.5); c.lineTo(w * 0.13, h * 0.64); c.fill();
    },
    rocker(c, w, h) {
      c.fillRect(w / 2 - w * 0.04, h * 0.14, w * 0.08, h * 0.2);
      c.lineWidth = w * 0.08; c.beginPath(); c.arc(w / 2, h * 0.76, h * 0.09, 0, Math.PI * 2); c.stroke();
    },
    slide(c, w, h) {
      c.font = font(600, h * 0.26); centreText(c, txt("Off"), w * 0.74, h / 2); centreText(c, txt("On"), w * 0.26, h / 2);
    },
    slideThumb(c, w, h) { for (let i = -1; i <= 1; i++) c.fillRect(w / 2 + i * w * 0.14 - w * 0.025, h * 0.3, w * 0.05, h * 0.4); },
    slider(c, w, h) {
      const pad = 14 * w / 264;
      for (let i = 0; i < 9; i++) {
        const x = pad + (w - 2 * pad) * i / 8, big = i % 4 === 0;
        c.fillRect(x - w * 0.003, 0, w * 0.006, h * (big ? 0.26 : 0.16));
        c.fillRect(x - w * 0.003, h * (big ? 0.74 : 0.84), w * 0.006, h);
      }
    },
    sliderThumb(c, w, h) { c.fillRect(w * 0.15, h / 2 - h * 0.03, w * 0.7, h * 0.06); },
    knob(c, w, h) { c.fillRect(w / 2 - w * 0.025, h * 0.06, w * 0.05, h * 0.3); },
    label(c, w, h) { c.font = font(600, h * 0.5); c.letterSpacing = `${h * 0.08}px`; centreText(c, txt("Kit name"), w / 2, h / 2 + 1); },
    field() {},
    panel(c, w, h, s) {
      if (!P.print) return;
      const pr = s.el.getBoundingClientRect(), k = w / pr.width;
      for (const el of s.el.querySelectorAll(".brand, .model, .cap")) {
        const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
        c.font = `${cs.fontWeight} ${parseFloat(cs.fontSize) * k}px ${cs.fontFamily}`;
        c.letterSpacing = `${(parseFloat(cs.letterSpacing) || 0) * k}px`;
        c.textBaseline = "middle";
        const t = cs.textTransform === "uppercase" ? el.textContent.toUpperCase() : el.textContent;
        const y = (r.top + r.height / 2 - pr.top) * k;
        if (el.classList.contains("cap")) { c.textAlign = "center"; c.fillText(t, (r.left + r.width / 2 - pr.left) * k, y); }
        else if (el.classList.contains("model")) { c.textAlign = "right"; c.fillText(t, (r.right - pr.left) * k, y); }
        else { c.textAlign = "left"; c.fillText(t, (r.left - pr.left) * k, y); }
      }
    },
  };

  const savedP = (() => { try { return JSON.parse(localStorage.getItem("worn-ui:panel-patina") || "null")?.panel; } catch { return null; } })();
  const P = Object.assign({ mode: "halo", spread: 1, print: true }, savedP);
  document.body.classList.toggle("panelprint", P.print);

  // ---------- build surfaces ----------
  const padsEl = document.getElementById("pads");
  for (let i = 0; i < 9; i++) { const d = document.createElement("div"); d.className = "surface pad"; d.id = "pad-" + i; padsEl.appendChild(d); }

  const surfaces = [];
  function surface(id, kind, mat, mw, mh, extra = {}) {

    if (dist < 0.5) return;
    const step = Math.max(2, C.brush * 0.3), n = Math.ceil(dist / step);
    for (let k = 1; k <= n; k++) {
      const px = scrub.x + dx * k / n, py = scrub.y + dy * k / n;
      for (const s of surfaces) scrubSurface(s, ...localPt(s, px, py), ...localVec(s, dx / n, dy / n), dist / n);
    }
    scrub.x = x; scrub.y = y;
    rag.style.setProperty("--soil", soil.toFixed(3));
    updateDirtLeft();
  }
  device.addEventListener("pointerdown", e => {
    if (!C.on) return;
    e.stopPropagation(); e.preventDefault();
    scrub = { x: e.clientX, y: e.clientY }; clothEl.classList.add("down");
    device.setPointerCapture(e.pointerId);
  }, true);
  addEventListener("pointermove", e => {
    clothEl.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    if (C.on && scrub) scrubTo(e.clientX, e.clientY);
  });
  addEventListener("pointerup", () => { scrub = null; clothEl.classList.remove("down"); scheduleSave(); });

  function updateDirtLeft() {
    let tot = 0; for (const s of surfaces) for (let i = 0; i < s.map.length; i += 2) tot += s.map[i] * (s.cssW * s.cssH) / (s.mw * s.mh);
    document.getElementById("dirtLeft").textContent = Math.round(tot / 100).toLocaleString();
  }

  const fmtC = { lift: v => C.liftMode === "prop" ? `${Math.round(v * 100)}%` : v.toFixed(2), brush: v => `${v}px`, smear: v => v.toFixed(2) };
  for (const id of ["lift", "brush", "smear"]) {
    const el = document.getElementById(id), out = document.getElementById(id + "-o");
    el.value = C[id]; out.textContent = fmtC[id](C[id]);
    el.addEventListener("input", () => { C[id] = +el.value; out.textContent = fmtC[id](C[id]); sizeCursor(); scheduleSave(); });
  }
  for (const id of ["liftMode", "cursor"]) {
    const el = document.getElementById(id); el.value = C[id];
    el.addEventListener("change", () => { C[id] = el.value; document.getElementById("lift-o").textContent = fmtC.lift(C.lift); sizeCursor(); scheduleSave(); });
  }
  document.getElementById("copy").addEventListener("click", e => {
    const { on, ...cloth } = C, txt = JSON.stringify({ panel: P, cloth });
    navigator.clipboard?.writeText(txt).catch(() => {});
    e.target.textContent = "Copied: " + txt; setTimeout(() => e.target.textContent = "Copy settings", 4000);
  });
  sizeCursor();
  document.querySelectorAll("[data-sim]").forEach(b => b.addEventListener("click", () => requestAnimationFrame(updateDirtLeft)));
  document.getElementById("reset").addEventListener("click", () => { soil = 0; rag.style.setProperty("--soil", 0); requestAnimationFrame(updateDirtLeft); });

  // ---------- panel controls ----------
  const pmode = document.getElementById("pmode"), spread = document.getElementById("spread"), pprint = document.getElementById("pprint");
  pmode.value = P.mode; spread.value = P.spread; pprint.checked = P.print;
  const spreadOut = () => document.getElementById("spread-o").textContent = P.spread.toFixed(1);
  spreadOut();
  pmode.addEventListener("change", () => { P.mode = pmode.value; scheduleSave(); });
  spread.addEventListener("input", () => { P.spread = +spread.value; spreadOut(); scheduleSave(); });
  pprint.addEventListener("change", () => { P.print = pprint.checked; document.body.classList.toggle("panelprint", P.print); layout(); scheduleSave(); });

  // ---------- style switch ----------
  function setStyle(s) {
    style = s; document.body.dataset.style = s;
    document.querySelectorAll("#styleSeg button").forEach(b => b.classList.toggle("on", b.dataset.s === s));
    requestAnimationFrame(() => { layout(); applySlider(); scheduleSave(); });
  }
  document.querySelectorAll("#styleSeg button").forEach(b => b.addEventListener("click", () => setStyle(b.dataset.s)));

  // ---------- persistence ----------
  let saveTimer = 0;
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 500); }
  function save() {
    const maps = {};
    for (const s of surfaces) {
      const u16 = new Uint16Array(s.map.length); for (let i = 0; i < u16.length; i++) u16[i] = Math.round(s.map[i] * 65535);
      const b = new Uint8Array(u16.buffer); let bin = ""; for (let i = 0; i < b.length; i += 8192) bin += String.fromCharCode(...b.subarray(i, i + 8192));
      maps[s.id] = btoa(bin);
    }
    const { on, ...cloth } = C;
    store.save({ style, state, maps, cloth, panel: P });
  }
  addEventListener("pagehide", save);
  gl.canvas.addEventListener("webglcontextlost", e => e.preventDefault());
  gl.canvas.addEventListener("webglcontextrestored", () => location.reload());
  addEventListener("resize", layout);

  document.body.dataset.style = style;
  document.querySelectorAll("#styleSeg button").forEach(b => b.classList.toggle("on", b.dataset.s === style));
  applyRocker(); applySlide(); applySlider(); applyKnob();
  (document.fonts?.ready || Promise.resolve()).then(() => { layout(); updateDirtLeft(); });
  window.__proto = { surfaces, state };
})();
</script>
